# Ordinary index.js after a separate device-only malformed Keychain write.
appId: ${APP_ID}
name: Normal app blocks malformed credentials and Retry cannot create an account
---
- launchApp
- extendedWaitUntil:
    visible: Unable to check your passcode. Please try again.
    timeout: 60000
- assertVisible: Something went wrong
- assertNotVisible: Create a passcode
- assertNotVisible: Enter your passcode
- assertNotVisible:
    id: home_visible_wallet_count_1
- runScript:
    file: product_credential_metric.js
    env:
      STAGE: malformed_startup_blocked
- tapOn: Retry
- extendedWaitUntil:
    visible: Unable to check your passcode. Please try again.
    timeout: 30000
- assertNotVisible: Create a passcode
- assertNotVisible: Enter your passcode
- assertNotVisible:
    id: home_visible_wallet_count_1
- runScript:
    file: product_credential_metric.js
    env:
      STAGE: retry_remains_blocked
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Unable to check your passcode. Please try again.
    timeout: 60000
- assertNotVisible: Create a passcode
- assertNotVisible: Enter your passcode
- runScript:
    file: product_credential_metric.js
    env:
      STAGE: malformed_cold_start_blocked
- stopApp
