appId: ${APP_ID}
---
- tapOn: Add Server
- extendedWaitUntil:
    visible:
      id: header_title
      text: Server Selection
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Private Electrum
- tapOn: Private Electrum
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: input_node-host
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Host
- inputText: 127.0.0.1
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: input_node-host
          text: 127\.0\.0\.1
      - hideKeyboard
      - tapOn:
          id: input_node-port
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: e.g 8080
- inputText: ${NODE_PORT}
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: input_node-port
          text: ${NODE_PORT}
- assertVisible: Port Number
- runFlow:
    when:
      visible: Type English and Hindi
    commands:
      - assertVisible: Continue
      - tapOn: Continue
- assertNotVisible: Type English and Hindi
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: Trusted certificate \(optional PEM\)
- runFlow:
    when:
      platform: iOS
      visible:
        id: inputView
    commands:
      - assertVisible:
          id: inputView
      - tapOn: Trusted certificate \(optional PEM\)
      - extendedWaitUntil:
          notVisible:
            id: inputView
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: input_node-ca
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: Trusted certificate \(optional PEM\)
- tapOn:
    id: input_node-ca
- runFlow:
    when:
      platform: Android
      true: ${NODE_CA.length > 0}
    commands:
      - evalScript: ${output.caLines = NODE_CA.split(String.fromCharCode(10)); output.caIndex = 0}
      - repeat:
          times: 512
          while:
            true: ${output.caIndex < output.caLines.length}
          commands:
            - runFlow:
                when:
                  true: ${output.caLines[output.caIndex].length > 0}
                commands:
                  - inputText: ${output.caLines[output.caIndex]}
            - runFlow:
                when:
                  true: ${output.caIndex < output.caLines.length - 1}
                commands:
                  - pressKey: enter
            - evalScript: ${output.caIndex = output.caIndex + 1}
      - assertTrue:
          condition: ${output.caIndex === output.caLines.length}
          label: All certificate lines entered
      - copyTextFrom:
          id: input_node-ca
      - assertTrue:
          condition: ${maestro.copiedText === NODE_CA}
          label: Android certificate field equals full fixture PEM
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${NODE_CA}
- hideKeyboard
- tapOn: Connect to Server
