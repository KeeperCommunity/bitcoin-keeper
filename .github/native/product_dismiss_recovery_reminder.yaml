# A skipped Recovery Key remains unconfirmed. Home shows this education sheet
# once per new app session after successful PIN login; complete its real UI flow.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: Protect Your Recovery Key
    timeout: 30000
# RNModal can still move the footer after the title becomes visible.
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: btn_secondaryText
    text: Skip for Now
- tapOn:
    id: btn_secondaryText
- extendedWaitUntil:
    visible: Continue Without Backup?
    timeout: 30000
- tapOn: Skip Backup
