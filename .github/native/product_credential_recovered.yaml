# Original device-only Keychain value restored; ordinary index.js is mandatory.
appId: ${APP_ID}
name: Normal app recovers the same disposable wallet after credential restoration
---
- launchApp
- extendedWaitUntil:
    visible: Enter your passcode
    timeout: 60000
- assertNotVisible: Create a passcode
- assertNotVisible: Unable to check your passcode. Please try again.
- runScript:
    file: product_credential_metric.js
    env:
      STAGE: restored_login_available
- repeat:
    times: 4
    commands:
      - tapOn:
          id: key_1
- tapOn: Proceed
- extendedWaitUntil:
    visible:
      id: home_visible_wallet_count_1
    timeout: 60000
- assertVisible: Mobile Wallet
- runScript:
    file: product_credential_metric.js
    env:
      STAGE: restored_wallet_preserved
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Enter your passcode
    timeout: 60000
- assertNotVisible: Create a passcode
- repeat:
    times: 4
    commands:
      - tapOn:
          id: key_1
- tapOn: Proceed
- extendedWaitUntil:
    visible:
      id: home_visible_wallet_count_1
    timeout: 60000
- assertVisible: Mobile Wallet
- runScript:
    file: product_credential_metric.js
    env:
      STAGE: restored_cold_wallet_preserved
- stopApp
