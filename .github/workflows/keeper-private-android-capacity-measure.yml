name: Keeper private Android stock capacity measurement
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: private-android-capacity-measure-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository_id == '839671816' && github.event.repository.private == true && github.event.pull_request.number == 73 && github.event.pull_request.head.repo.id == 839671816 && github.event.label.name == 'keeper/android-capacity-measurement' && !contains(github.event.pull_request.labels.*.name, 'keeper/native-diagnostic')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      HUSKY: '0'
      KEEPER_CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      KEEPER_NATIVE_PLATFORM: ANDROID
      KEEPER_DIAGNOSTIC: 'true'
    steps:
      - name: Check out exact reviewed capacity controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify current isolated private source-only selection
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 73 });
            if (repo.id !== 839671816 || !repo.private || pr.head.repo.id !== repo.id || pr.head.sha !== process.env.KEEPER_CONTROLLER_SHA || pr.merge_commit_sha !== process.env.GITHUB_SHA || !pr.labels.some(x => x.name === 'keeper/android-capacity-measurement') || pr.labels.some(x => x.name === 'keeper/native-diagnostic')) {
              core.setFailed('Source-only private capacity selection moved.');
            }
      - name: Set up unchanged pinned Node and cache for comparable disk facts
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          cache: yarn
      - name: Set up unchanged Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up unchanged pinned Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Measure fixed unused stock paths without cleanup or native execution
        run: python3 .github/native/android_runtime_capacity_measure.py
      - name: Retain bounded source-only capacity facts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keeper-private-android-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/private-android-capacity/measurement.json
          if-no-files-found: error
          retention-days: 1
