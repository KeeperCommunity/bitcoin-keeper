name: Keeper release origin contracts

on:
  pull_request:
    paths:
      - '.github/workflows/keeper-release-origin-contracts.yml'
      - 'scripts/trusted-release-origin*'
      - 'scripts/codeql-analysis-receipt*'
      - '.github/workflows/codeql.yml'
      - 'docs/r5-trusted-release-origin.md'
  push:
    paths:
      - '.github/workflows/keeper-release-origin-contracts.yml'
      - 'scripts/trusted-release-origin*'
      - 'scripts/codeql-analysis-receipt*'
      - '.github/workflows/codeql.yml'
      - 'docs/r5-trusted-release-origin.md'

permissions:
  contents: read

concurrency:
  group: release-origin-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Mocked read-only provenance contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out contract source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Test fake API and bounded artifact evidence
        run: node --test scripts/trusted-release-origin.test.cjs scripts/codeql-analysis-receipt.test.cjs scripts/protected-release-plan.test.cjs
