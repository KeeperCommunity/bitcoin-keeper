name: Keeper local validation gate

# Trusted base-branch workflow only: never check out or execute PR code here.
on:
  pull_request_target:
    branches: [sprint]
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Keeper hosted native validation, Keeper release acceptance]
    types: [completed, requested, in_progress]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  statuses: write

concurrency:
  group: keeper-local-validation-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  keeper-local-validation:
    name: Keeper local validation gate
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request != null || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify local validation for exact PR commit
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request?.number ??
              context.payload.workflow_run?.pull_requests?.[0]?.number ?? context.issue.number;
            if (!pull_number) return;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.base.ref !== 'sprint') {
              core.info('Only PRs targeting sprint use this validation gate.');
              return;
            }

            const sha = pr.head.sha;
            const contextName = 'keeper/local-validation';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            const docsOnly = files.length > 0 && files.every(({ filename }) =>
              /(^|\/)[^/]+\.mdx?$/i.test(filename) || filename.startsWith('.github/')
            );

            const section = (body, heading) => {
              const lines = (body || '').split(/\r?\n/);
              const start = lines.findIndex(line =>
                line.trim().toLowerCase() === '## ' + heading.toLowerCase()
              );
              if (start < 0) return '';
              const end = lines.findIndex((line, index) =>
                index > start && /^##\s+\S/.test(line)
              );
              return lines.slice(start + 1, end < 0 ? undefined : end).join('\n');
            };
            const field = (body, name) => {
              const prefix = name.toLowerCase() + ':';
              const line = (body || '').split(/\r?\n/).find(line =>
                line.trim().toLowerCase().startsWith(prefix)
              );
              return line ? line.trim().slice(prefix.length).trim() : '';
            };

            // A PR author or commenter needs WRITE/MAINTAIN/ADMIN permissions
            // for this repository; being a member of the organization alone
            // is not sufficient.
            const permissionCache = new Map();
            const mayAttest = async login => {
              if (!login) return false;
              if (permissionCache.has(login)) return permissionCache.get(login);
              let allowed = false;
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: login
                });
                allowed = ['write', 'admin'].includes(data.permission) ||
                  ['write', 'maintain', 'admin'].includes(data.role_name);
              } catch (err) {
                core.warning('Could not verify repository permissions for ' + login +
                  ': ' + err.message);
              }
              permissionCache.set(login, allowed);
              return allowed;
            };

            // PR workflows are editable by the PR author. A successful check name
            // alone is NOT evidence. All executable CI files must match both the
            // protected current base and the base used by that particular run.
            // This intentionally rejects this infrastructure PR's bootstrap runs.
            const nativeRoute = value => value.labels?.some(label => label.name === 'keeper/native-diagnostic')
              ? 'diagnostic' : value.labels?.some(label => label.name === 'keeper/legacy-native')
                ? 'keeper-hosted-native.yml' : 'keeper-release-acceptance.yml';
            const hostedPasses = async () => {
              const passed = new Set();
              try {
                const selectedWorkflow = nativeRoute(pr);
                if (selectedWorkflow === 'diagnostic') return passed;
                const repository = owner + '/' + repo;
                if (pr.head.repo?.full_name !== repository) return passed;
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: selectedWorkflow,
                  head_sha: sha, event: 'pull_request', per_page: 100
                });
                // Do not fall back to an older success after a failed/cancelled
                // rerun or while newer evidence is pending.
                const run = runs.sort((a, b) => b.id - a.id)[0];
                const reusable = run?.path === '.github/workflows/keeper-release-acceptance.yml';
                const workflowPath = '.github/workflows/' + selectedWorkflow;
                if (reusable && pull_number === 7045) return passed;
                if (!run || run.head_sha !== sha || run.event !== 'pull_request' ||
                    run.path !== workflowPath || run.head_branch !== pr.head.ref ||
                    run.head_repository?.full_name !== repository ||
                    run.status !== 'completed' || !['success', 'failure'].includes(run.conclusion)) {
                  return passed;
                }
                const linked = run.pull_requests?.find(p => p.number === pull_number);
                if (!linked || linked.head?.sha !== sha || linked.head?.ref !== pr.head.ref ||
                    linked.base?.ref !== 'sprint' || !linked.base?.sha ||
                    linked.head?.repo?.id !== pr.head.repo.id ||
                    linked.base?.repo?.id !== pr.base.repo?.id ||
                    !pr.head.repo.id || !pr.base.repo?.id ||
                    !Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) return passed;
                const fingerprint = async ref => {
                  const { data } = await github.rest.git.getTree({ owner, repo, tree_sha: ref, recursive: '1' });
                  if (data.truncated) throw new Error('Truncated trusted CI tree');
                  const requiredWorkflows = reusable
                    ? [workflowPath, '.github/workflows/keeper-native-platform.yml', '.github/workflows/keeper-hosted-native.yml']
                    : [workflowPath];
                  const entries = data.tree.filter(e => requiredWorkflows.includes(e.path) ||
                    e.path.startsWith('.github/native/'));
                  if (!requiredWorkflows.every(path => entries.some(e => e.path === path && e.type === 'blob' && ['100644', '100755'].includes(e.mode))) ||
                      !entries.some(e => e.path.startsWith('.github/native/') && e.type === 'blob')) {
                    throw new Error('Hosted native infrastructure not present in trusted base');
                  }
                  return JSON.stringify(entries.map(e => [e.path, e.mode, e.type, e.sha])
                    .sort((a, b) => a[0].localeCompare(b[0])));
                };
                const [headFiles, baseFiles, runBaseFiles] = await Promise.all([
                  fingerprint(sha), fingerprint(pr.base.sha), fingerprint(linked.base.sha)
                ]);
                if (headFiles !== baseFiles || headFiles !== runBaseFiles) return passed;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                  owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
                });
                for (const [platform, legacyName] of [['IOS', 'Hosted iOS simulator'],
                  ['ANDROID', 'Hosted Android emulator']]) {
                  const name = reusable ? `${platform.toLowerCase()} / Native ${platform} build and probes` : legacyName;
                  const matches = jobs.filter(j => j.name === name);
                  if (matches.length !== 1) continue;
                  const job = matches[0];
                  if (job.head_sha !== sha || job.run_id !== run.id || job.run_attempt !== run.run_attempt ||
                      job.status !== 'completed' || job.conclusion !== 'success') continue;
                  const steps = reusable
                    ? ['Build development app', ...(platform === 'IOS'
                      ? ['Run disposable startup smoke', 'Run disposable native persistence probe']
                      : ['Run Android startup and native persistence probes'])]
                    : ['Build development app', 'Run disposable startup smoke'];
                  if (steps.every(name => job.steps?.filter(s => s.name === name &&
                      s.status === 'completed' && s.conclusion === 'success').length === 1)) {
                    passed.add(platform);
                    core.info(platform + ' hosted evidence: ' + run.html_url + ', attempt ' + run.run_attempt);
                  }
                }
              } catch (err) {
                core.warning('Hosted evidence unavailable; local fallback retained: ' + err.message);
              }
              return passed;
            };

            let state = 'failure';
            let description = 'Awaiting exact-head hosted or local native validation';
            if (docsOnly) {
              state = 'success';
              description = 'Documentation/GitHub metadata only; local testing exempt';
            } else {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull_number, per_page: 100
              });
              const sources = [
                { body: pr.body, login: pr.user.login },
                ...comments.map(c => ({ body: c.body, login: c.user?.login }))
              ];
              const trustedHandoffs = [];
              for (const source of sources) {
                const text = section(source.body, 'Codex local handoff');
                if (text && field(text, 'Head commit') === sha &&
                    await mayAttest(source.login)) {
                  trustedHandoffs.push(text);
                }
              }

              if (!trustedHandoffs.length) {
                description = 'Trusted Cloud handoff for current SHA required';
              } else if (trustedHandoffs.some(h => field(h, 'State') !== 'NEEDS_LOCAL')) {
                description = 'Cloud handoff State must be NEEDS_LOCAL';
              } else {
                const required = new Set();
                let malformed = false;
                for (const handoff of trustedHandoffs) {
                  const raw = field(handoff, 'Required local checks');
                  const items = raw.toUpperCase().split(/[,\s]+/).filter(Boolean);
                  if (!items.length || items.some(x =>
                    !['IOS', 'ANDROID', 'HARDWARE'].includes(x))) {
                    malformed = true;
                  } else {
                    items.forEach(x => required.add(x));
                  }
                }
                if (malformed) {
                  description = 'Specify Required local checks: IOS, ANDROID, HARDWARE';
                } else {
                  const hosted = await hostedPasses();
                  // Only the release owner can defer unrun physical checks. Keep
                  // every original handoff intact, and bind the newest owner
                  // decision to this PR and this exact head commit.
                  const releaseOwnerLogin = 'antuz123';
                  let ownerDecision = '';
                  let ownerDecisionIndex = -1;
                  for (let index = comments.length - 1; index >= 0; index--) {
                    const comment = comments[index];
                    if (comment.user?.login !== releaseOwnerLogin) continue;
                    const content = section(comment.body, 'Codex local scope decision');
                    if (content && field(content, 'PR') === '#' + pull_number &&
                        field(content, 'Head commit') === sha &&
                        await mayAttest(comment.user.login)) {
                      ownerDecision = content;
                      ownerDecisionIndex = index;
                      break;
                    }
                  }
                  const hardwareDeferral = Boolean(ownerDecision &&
                    field(ownerDecision, 'State') === 'OWNER_DEFERRED_PHYSICAL' &&
                    field(ownerDecision, 'Deferred local checks').trim().toUpperCase() === 'HARDWARE' &&
                    field(ownerDecision, 'Reason') &&
                    field(ownerDecision, 'Post-release follow-up'));

                  let report = '';
                  let reportIndex = -1;
                  for (let index = comments.length - 1; index >= 0; index--) {
                    const comment = comments[index];
                    const content = section(comment.body, 'Codex local validation');
                    if (content && field(content, 'Tested commit') === sha &&
                        await mayAttest(comment.user?.login)) {
                      report = content;
                      reportIndex = index;
                      break;
                    }
                  }
                  if (report && field(report, 'State') !== 'LOCAL_PASSED') {
                    description = 'Latest local validation is not LOCAL_PASSED';
                  } else {
                    const reportFields = {
                      IOS: 'iOS build/simulator',
                      ANDROID: 'Android build/emulator',
                      HARDWARE: 'Real devices/signers'
                    };
                    const hardwareResult = field(report, reportFields.HARDWARE);
                    const hardwareDeferred = required.has('HARDWARE') && hardwareDeferral &&
                      reportIndex > ownerDecisionIndex &&
                      /^(not run|deferred)\b/i.test(hardwareResult);
                    const notPassed = [...required].filter(x => {
                      const result = field(report, reportFields[x]);
                      if (/^fail(?:ed)?\b/i.test(result)) return true;
                      return !/^pass\b/i.test(result) && !hosted.has(x) &&
                        !(x === 'HARDWARE' && hardwareDeferred);
                    });
                    if (hardwareDeferred && !required.has('IOS') && !required.has('ANDROID')) {
                      description = 'IOS or ANDROID required before HARDWARE deferral';
                    } else if (notPassed.length) {
                      description = 'Missing local PASS: ' + notPassed.join(', ');
                    } else {
                      state = 'success';
                      const passed = [...required].filter(x =>
                        /^pass\b/i.test(field(report, reportFields[x])) || hosted.has(x)
                      );
                      description = 'Validated at current SHA: ' + passed.join(', ') +
                        (hosted.size ? '; hosted ' + [...hosted].join(', ') : '') +
                        (hardwareDeferred ? '; owner-deferred HARDWARE' : '');
                    }
                  }
                }
              }
            }

            // API reads above can take time. Never post a success for a head that
            // changed while evidence was being collected.
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (current.head.sha !== sha) {
              core.setFailed('PR head changed during validation; awaiting new-head evaluation');
              return;
            }
            if (current.base.sha !== pr.base.sha || current.base.ref !== pr.base.ref ||
                current.base.repo?.id !== pr.base.repo?.id || current.base.repo?.full_name !== pr.base.repo?.full_name ||
                current.head.ref !== pr.head.ref || current.head.repo?.id !== pr.head.repo?.id ||
                current.head.repo?.full_name !== pr.head.repo?.full_name || nativeRoute(current) !== nativeRoute(pr)) {
              // The head is unchanged, so explicitly revoke any prior success on this SHA.
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, state: 'failure', context: contextName,
                description: 'PR base, identity or native route changed; fresh evaluation required',
                target_url: pr.html_url
              });
              core.setFailed('PR base, repository, ref or native route changed during validation; awaiting fresh evaluation');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state,
              context: contextName,
              description: description.slice(0, 140),
              target_url: pr.html_url
            });
            core.info(contextName + ': ' + state + ' on ' + sha + ' — ' + description);
            if (state !== 'success') core.setFailed(description);
