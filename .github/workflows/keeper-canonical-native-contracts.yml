name: Canonical native provenance contracts
on:
  pull_request:
    branches: [sprint]
    paths:
      - '.github/native/canonical_*'
      - '.github/native/public_software_receipts.cjs'
      - '.github/native/public_companion_receipts.cjs'
      - '.github/native/actions_software_evidence.cjs'
      - '.github/native/software_artifact_zip.py'
      - '.github/native/strict_json.cjs'
      - '.github/native/release_evidence.cjs'
      - '.github/native/release_acceptance.cjs'
      - '.github/native/release_preflight.cjs'
      - '.github/tests/public-software-receipts.test.cjs'
      - '.github/tests/public-companion-receipts.test.cjs'
      - '.github/tests/actions-software-evidence.test.cjs'
      - '.github/tests/release-evidence.test.cjs'
      - '.github/tests/release-pipeline.test.cjs'
      - '.github/tests/test_software_artifact_zip.py'
      - '.github/tests/strict-json.test.cjs'
      - '.github/tests/fixtures/**'
      - '.github/tests/canonical-native.test.cjs'
      - '.github/tests/test_canonical_metadata.py'
      - '.github/workflows/keeper-canonical-native*'
      - '.github/scripts/verify-ci-source.cjs'
      - '.github/tests/ci-source-identity.test.cjs'
      - '.github/tests/contract-source-identity.test.cjs'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
      - name: Verify exact event source before checks
        run: node .github/scripts/verify-ci-source.cjs
      - name: Test read-only canonical trust and archive controls
        run: |
          node --test .github/tests/canonical-native.test.cjs .github/tests/strict-json.test.cjs .github/tests/public-software-receipts.test.cjs .github/tests/public-companion-receipts.test.cjs .github/tests/actions-software-evidence.test.cjs .github/tests/release-evidence.test.cjs .github/tests/release-pipeline.test.cjs
          python3 -B -m unittest discover -s .github/tests -p test_canonical_metadata.py
          python3 -B -m unittest discover -s .github/tests -p test_software_artifact_zip.py
      - name: Verify exact source after checks
        if: always()
        run: node .github/scripts/verify-ci-source.cjs
