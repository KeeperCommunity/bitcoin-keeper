name: Canonical native provenance contracts
on:
  pull_request:
    branches: [sprint]
    paths:
      - '.github/native/canonical_*'
      - '.github/tests/canonical-native.test.cjs'
      - '.github/tests/test_canonical_metadata.py'
      - '.github/workflows/keeper-canonical-native*'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
      - name: Test read-only canonical trust and archive controls
        run: |
          node --test .github/tests/canonical-native.test.cjs
          python3 -m unittest discover -s .github/tests -p test_canonical_metadata.py
