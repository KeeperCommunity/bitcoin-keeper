name: Canonical native provenance contracts
on:
  pull_request:
    branches: [sprint]
    paths:
      - '.github/native/canonical_*'
      - '.github/native/installed_parent_window.cjs'
      - '.github/native/installed_parent_software.cjs'
      - '.github/native/private_actions*'
      - '.github/native/private_integration_receipts.cjs'
      - '.github/native/parent_software_evidence.cjs'
      - '.github/native/private_software_artifact_zip.py'
      - '.github/tests/private-actions*'
      - '.github/tests/private-integration-receipts.test.cjs'
      - '.github/tests/parent-software-evidence.test.cjs'
      - '.github/tests/private-source-proof-scopes.test.cjs'
      - '.github/tests/private-artifact-stream.test.cjs'
      - '.github/tests/installed-parent-software.test.cjs'
      - '.github/tests/test_private_software_artifact_zip.py'
      - '.github/tests/fixtures/private-actions.cjs'
      - '.github/tests/fixtures/private-software.cjs'
      - '.github/tests/fixtures/private-integration.cjs'
      - '.github/tests/fixtures/parent-software.cjs'
      - '.github/tests/fixtures/producer-source-proofs.json'
      - '.github/tests/fixtures/private-artifact-real-sdk.cjs'
      - '.github/tests/installed-parent-window.test.cjs'
      - '.github/tests/installed-parent-bootstrap.test.cjs'
      - '.github/tests/fixtures/installed-parent.cjs'
      - 'docs/r5/INSTALLED-PARENT-ADMISSION.md'
      - 'docs/r5/CANONICAL-SOURCE-SUCCESSOR.md'
      - '.github/tests/canonical-native.test.cjs'
      - '.github/tests/test_canonical_metadata.py'
      - '.github/workflows/keeper-canonical-native*'
      - '.github/scripts/verify-ci-source.cjs'
      - '.github/tests/ci-source-identity.test.cjs'
      - '.github/tests/contract-source-identity.test.cjs'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
      - name: Verify exact event source before checks
        run: node .github/scripts/verify-ci-source.cjs
      - name: Test read-only canonical trust and archive controls
        run: |
          node --test .github/tests/canonical-native.test.cjs .github/tests/installed-parent-window.test.cjs .github/tests/installed-parent-bootstrap.test.cjs
          node --test .github/tests/private-actions-origin.test.cjs .github/tests/private-actions-pagination.test.cjs .github/tests/private-actions-software.test.cjs .github/tests/private-artifact-stream.test.cjs .github/tests/installed-parent-software.test.cjs
          node --test .github/tests/private-integration-receipts.test.cjs .github/tests/parent-software-evidence.test.cjs .github/tests/private-source-proof-scopes.test.cjs
          python3 -B -m unittest discover -s .github/tests -p test_canonical_metadata.py
          python3 -B -m unittest discover -s .github/tests -p test_private_software_artifact_zip.py
      - name: Test actual pinned SDK with disposable private transport boundaries
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = require('./.github/tests/fixtures/private-artifact-real-sdk.cjs');
            await run(github.constructor);
      - name: Verify exact source after checks
        if: always()
        run: node .github/scripts/verify-ci-source.cjs
