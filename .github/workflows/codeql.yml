name: CodeQL

on:
  push:
    branches:
      - sprint
      - dev
      - main
      - 'release/*'
  pull_request:
    branches:
      - sprint
      - dev
      - main
      - 'release/*'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Public CodeQL is free. Private test copies must not request the paid feature.
    if: github.repository == 'KeeperCommunity/bitcoin-keeper' && github.event.repository.private == false
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4
