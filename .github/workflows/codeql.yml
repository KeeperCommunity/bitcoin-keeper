name: CodeQL

on:
  push:
    branches:
      - sprint
      - dev
      - main
      - 'release/*'
  pull_request:
    branches:
      - sprint
      - codex/r3-release-baseline-to-sprint
      - dev
      - main
      - 'release/*'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Keep private copies off until an administrator explicitly selects their
    # existing Code Security entitlement. This variable does not enable/buy it;
    # the real analysis/upload must still succeed before release acceptance.
    if: (github.repository == 'KeeperCommunity/bitcoin-keeper' && github.repository_id == '470904030' && github.event.repository.private == false) || (github.repository == 'KeeperCommunity/bitcoin-keeper-private' && github.repository_id == '839671816' && github.event.repository.private == true && vars.KEEPER_PRIVATE_CODEQL_ENABLED == 'true' && fromJSON(vars.KEEPER_PRIVATE_CODEQL_ENABLED || 'false') == true)
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEEPER_PRIVATE_CODEQL_ENABLED: ${{ vars.KEEPER_PRIVATE_CODEQL_ENABLED }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up supported receipt tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'

      - name: Validate exact repository opt-in before any CodeQL request
        run: node scripts/codeql-analysis-receipt.cjs --check-selection

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript

      - name: Analyze
        id: codeql
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: keeper-javascript-typescript/
          wait-for-processing: true

      - name: Capture official CodeQL upload ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/sprint'
        env:
          KEEPER_CODEQL_SARIF_ID: ${{ steps.codeql.outputs.sarif-id }}
          KEEPER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/codeql-analysis-receipt.cjs

      - name: Upload CodeQL analysis provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/sprint'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keeper-codeql-analysis-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keeper-codeql-analysis/analysis.json
          if-no-files-found: error
          retention-days: 7
