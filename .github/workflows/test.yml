name: Run Tests

on:
  push:
    branches:
      - sprint
      - dev
      - main
      - release/2.6.3
  pull_request:
    branches:
      - sprint
      - dev
      - main
      - release/2.6.3

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: npm run test

      - name: Test Android reproducibility tools
        run: python3 -B -m unittest scripts/test_compare_android_apks.py reproducibility/test_verify_android_inputs.py
