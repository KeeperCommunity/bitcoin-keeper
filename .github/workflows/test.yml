name: CI

on:
  push:
    branches:
      - sprint
      - dev
      - main
      - release/2.6.3
  pull_request:
    branches:
      - sprint
      - dev
      - main
      - release/2.6.3

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Run lint
        run: npm run lint
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install

      - name: Check USDT pause and retired build inputs
        run: |
          node --test tests/services/usdtPause.test.cjs tests/recovery/usdtBackup.test.cjs \
            scripts/verify-channel-config.test.cjs ios/scripts/verify-retired-env.test.cjs

      - name: Run tests
        run: npm run test

      - name: Run recovery regression tests
        run: npm run test:recovery

      - name: Verify checked-out release version consistency
        run: npm run version:check

      - name: Run release and packaged-artifact tests
        run: npm run test:release

      - name: Test Android reproducibility tools
        run: python3 -B -m unittest scripts/test_compare_android_apks.py reproducibility/test_verify_android_inputs.py
