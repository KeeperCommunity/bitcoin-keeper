name: Keeper private Android runtime evidence readout
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  readout:
    if: github.repository_id == '839671816' && github.event.repository.private == true && github.event.pull_request.number == 73 && github.event.pull_request.head.repo.id == 839671816 && github.event.label.name == 'keeper/android-runtime-evidence-readout' && !contains(github.event.pull_request.labels.*.name, 'keeper/native-diagnostic') && !contains(github.event.pull_request.labels.*.name, 'keeper/android-runtime-reuse')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KEEPER_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      KEEPER_READ_ONLY_RUNTIME_EVIDENCE: '1'
    steps:
      - name: Check out exact private read-only projector
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify private selection and fetch only exact retained metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
            const assert = value => { if (!value) throw new Error('Exact read-only artifact admission rejected.'); };
            const { data: repo } = await github.rest.repos.get(context.repo);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 73 });
            const labels = pr.labels.map(x => x.name);
            assert(repo.id === 839671816 && repo.private && pr.state === 'open' && !pr.merged && pr.head.repo.id === repo.id && pr.head.sha === process.env.KEEPER_SOURCE_SHA);
            assert(labels.includes('keeper/android-runtime-evidence-readout') && !labels.includes('keeper/native-diagnostic') && !labels.includes('keeper/android-runtime-reuse'));
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: 40330947369 });
            const { data: job } = await github.rest.actions.getJobForWorkflowRun({ ...context.repo, job_id: 121599903084 });
            const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: 12656541173 });
            assert(run.id === 40330947369 && run.run_attempt === 1 && run.head_sha === '68c7dad6b1190b8fb3608c0dd7cd8aace48bd144' && run.status === 'completed' && run.conclusion === 'failure' && run.workflow_id === 396708017 && run.repository.id === repo.id && run.repository.private);
            assert(job.id === 121599903084 && job.run_id === run.id && job.head_sha === run.head_sha && job.run_attempt === 1 && job.name === 'reuse' && job.status === 'completed' && job.conclusion === 'failure');
            assert(artifact.id === 12656541173 && artifact.expired === false && artifact.size_in_bytes === 10349 && artifact.name === 'keeper-private-android-runtime-metadata-40330947369-1' && artifact.digest === 'sha256:70e6757ea3af4ea6a9ac62e30e3971ae09cfca71333eb890fd18437f99834271');
            assert(artifact.workflow_run.id === run.id && artifact.workflow_run.head_sha === run.head_sha && artifact.workflow_run.repository_id === repo.id && artifact.workflow_run.head_repository_id === repo.id);
            const { data } = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: artifact.id, archive_format: 'zip' });
            const raw = Buffer.from(data);
            assert(raw.length === artifact.size_in_bytes && crypto.createHash('sha256').update(raw).digest('hex') === artifact.digest.slice(7));
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'keeper-exact-runtime-evidence.zip'), raw, { flag: 'wx', mode: 0o600 });
      - name: Project bounded observations only without app execution
        run: python3 .github/native/android_runtime_evidence_readout.py
      - name: Retain read-only bounded projection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keeper-private-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/private-runtime-evidence/summary.json
          retention-days: 7
          if-no-files-found: error
