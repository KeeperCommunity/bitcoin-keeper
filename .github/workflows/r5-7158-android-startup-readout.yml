name: Read fixed 7158 Android startup observations

on:
  push:
    branches: [codex/r5-7158-android-startup-readout-20261024]
    paths:
      - .github/workflows/r5-7158-android-startup-readout.yml
      - .github/scripts/read-7158-android-startup-artifact.cjs
      - .github/scripts/read-7158-android-startup-artifact.py
      - .github/tests/7158-android-startup-readout.test.cjs
      - .github/tests/test_7158_android_startup_readout.py

permissions:
  contents: read
  actions: read

concurrency:
  group: r5-fixed-7158-android-startup-readout
  cancel-in-progress: false

jobs:
  readout:
    if: github.repository == 'KeeperCommunity/bitcoin-keeper' && github.event_name == 'push' && github.ref == 'refs/heads/codex/r5-7158-android-startup-readout-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node .github/scripts/verify-ci-source.cjs
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: await require('./.github/scripts/read-7158-android-startup-artifact.cjs').run({ github, context, core })
      - if: always()
        run: node .github/scripts/verify-ci-source.cjs
