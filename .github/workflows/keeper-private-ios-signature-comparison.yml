name: Keeper private iOS retained signature comparison
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: private-ios-launch-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository_id == '839671816' && github.event.repository.private == true && github.event.pull_request.head.repo.id == 839671816 && github.event.label.name == 'keeper/ios-signature-comparison' && !contains(github.event.pull_request.labels.*.name, 'keeper/native-diagnostic')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KEEPER_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      KEEPER_NATIVE_PLATFORM: IOS
      KEEPER_DIAGNOSTIC: 'true'
      KEEPER_PRIVATE_IOS_SIGNATURE_COMPARISON: '1'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out exact private source and original build ancestry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 20
          persist-credentials: false
      - name: Download exact retained private simulator app
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/native/ios_signature_download.cjs')({ github, context });
      - name: Compare teamless, identity groups, and empty simulator policies without rebuilding
        run: python3 .github/native/ios_signature_comparison.py
      - name: Retain scoped private comparison evidence for one day
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keeper-private-ios-signature-comparison-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/private-ios-launch-debug/
          retention-days: 1
          if-no-files-found: warn
