name: Keeper reusable native platform

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      platform:
        type: string
        required: true

      diagnostic:
        type: boolean
        default: false
        required: false

# This worker has no environment, release credentials, secret inputs or dispatch.
permissions:
  contents: read
  pull-requests: read

jobs:
  native:
    name: Native ${{ inputs.platform }} build and probes
    if: github.event_name == 'pull_request' && github.event.pull_request.number != 7045 && inputs.source_sha == github.event.pull_request.head.sha && (toJSON(github.event.pull_request.draft) == 'false' || (inputs.diagnostic && contains(github.event.pull_request.labels.*.name, 'keeper/native-diagnostic')))
    runs-on: ${{ inputs.platform == 'IOS' && 'macos-15' || 'ubuntu-24.04' }}
    # One build/device per platform includes all scoped companion UI phases.
    # Standard hosted runners only; this is a global fail-closed runtime ceiling.
    timeout-minutes: 240
    env:
      CI: 'true'
      HUSKY: '0'
      KEEPER_SOURCE_SHA: ${{ inputs.source_sha }}
      KEEPER_NATIVE_PLATFORM: ${{ inputs.platform }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      KEEPER_DIAGNOSTIC: ${{ inputs.diagnostic }}
    steps:
      - name: Check out exact app source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify current diagnostic source
        if: inputs.diagnostic
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
            if (pr.head.sha !== process.env.EXPECTED_SOURCE || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` || !pr.labels.some(label => label.name === 'keeper/native-diagnostic')) {
              core.setFailed('Diagnostic source moved or opt-in removed; no native credit');
            }
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: yarn
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Ruby
        if: inputs.platform == 'IOS'
        uses: ruby/setup-ruby@675dd7ba1b06c8786a1480d89c384f5620a42647 # v1.281.0
        with:
          ruby-version: '3.3.8'
      - name: Select reviewed Xcode
        if: inputs.platform == 'IOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Set up Android command-line tools
        if: inputs.platform == 'ANDROID'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Record runner and toolchain
        run: python3 .github/native/hosted_native.py record
      - name: Install immutable native dependencies
        run: python3 .github/native/hosted_native.py prepare
      - name: Check disposable iOS driver readiness
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py driver
      - name: Build development app
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py build
      - name: Run disposable startup smoke
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py smoke
      - name: Run disposable native persistence probe
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py probe
      - name: Run R5 production worker native scenarios
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py features
      - name: Measure five full-product startup and first-wallet runs
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/product_measurements.py run
      - name: Enable emulator acceleration
        if: inputs.platform == 'ANDROID'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keeper-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android startup and native persistence probes
        if: inputs.platform == 'ANDROID'
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/hosted_native.py smoke
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/hosted_native.py probe
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/hosted_native.py features
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/product_measurements.py run
      - name: Retain safe Phase A evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keeper-${{ inputs.diagnostic && 'diagnostic' || 'release' }}-native-${{ inputs.platform }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/*/metadata.json
          if-no-files-found: error
          retention-days: 7
