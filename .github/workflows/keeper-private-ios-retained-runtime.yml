name: Keeper private iOS retained app runtime
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  runtime:
    # Only an admitted job occupies the shared private iOS slot. Wrong-label
    # workflows must skip without replacing another pending diagnostic.
    concurrency:
      group: private-ios-launch-debug-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: github.repository_id == '839671816' && github.event.repository.private == true && github.event.pull_request.head.repo.id == 839671816 && github.event.label.name == 'keeper/ios-retained-runtime' && !contains(github.event.pull_request.labels.*.name, 'keeper/native-diagnostic')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: 'true'
      HUSKY: '0'
      KEEPER_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      KEEPER_NATIVE_PLATFORM: IOS
      KEEPER_DIAGNOSTIC: 'true'
      KEEPER_PRIVATE_IOS_RETAINED_RUNTIME: '1'
      MAESTRO_CLI_NO_ANALYTICS: '1'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out exact private controller and original app ancestry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 30
          persist-credentials: false
      - name: Require exact reviewed empty-policy launch evidence and original app source
        run: python3 .github/native/ios_retained_runtime.py verify
      - name: Admit exact original successful build and preserved app
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/native/ios_retained_runtime_download.cjs')({ github, context });
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          cache: yarn
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up frozen Ruby toolchain
        uses: ruby/setup-ruby@675dd7ba1b06c8786a1480d89c384f5620a42647 # v1.281.0
        with:
          ruby-version: '3.3.8'
      - name: Record current controller and toolchain without app compilation
        run: python3 .github/native/ios_retained_runtime.py record
      - name: Prepare immutable dependencies and disposable configuration
        run: python3 .github/native/ios_retained_runtime.py prepare
      - name: Restore exact app and reproduce diagnostic empty-entitlement signature
        run: python3 .github/native/ios_retained_runtime.py restore
      - name: Run actual app startup and disposable PIN transition
        run: python3 .github/native/ios_retained_runtime.py startup
      - name: Test actual disposable Keychain write reopen update and deletion
        run: python3 .github/native/ios_retained_runtime.py keychain
      - name: Run native persistence probe after actual startup passes
        run: python3 .github/native/ios_retained_runtime.py probe
      - name: Run production worker feature probe after startup and persistence pass
        run: python3 .github/native/ios_retained_runtime.py features
      - name: Retain source-qualified runtime metadata and scoped startup evidence
        if: always()
        run: python3 .github/native/ios_retained_runtime.py retain
      - name: Upload private runtime evidence for one day
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keeper-private-ios-retained-runtime-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/private-ios-retained-runtime/
          retention-days: 1
          if-no-files-found: warn
