name: Keeper canonical native platform

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      platform:
        type: string
        required: true
    secrets:
      canonical_pin_read_token:
        description: Repository-selected Variables read identity for live pin verification only
        required: true

# This worker has no environment, release credentials or dispatch. Its only
# secret input is scoped to the initial live-pin verification script.
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  native:
    name: Canonical ${{ inputs.platform }} build and features
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sprint' && inputs.source_sha == github.sha
    runs-on: ${{ inputs.platform == 'IOS' && 'macos-15' || 'ubuntu-24.04' }}
    # Same standard hosted workers and feature budget as candidate diagnostics.
    timeout-minutes: 240
    env:
      CI: 'true'
      HUSKY: '0'
      KEEPER_SOURCE_SHA: ${{ inputs.source_sha }}
      KEEPER_NATIVE_PLATFORM: ${{ inputs.platform }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      KEEPER_DIAGNOSTIC: 'false'
    steps:
      - name: Check out exact app source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify canonical installed source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          KEEPER_CANONICAL_NATIVE_DRIVER_SHA: ${{ vars.KEEPER_CANONICAL_NATIVE_DRIVER_SHA }}
          KEEPER_CANONICAL_PIN_READ_TOKEN: ${{ secrets.canonical_pin_read_token }}
        with:
          script: |
            try {
              // Remove read credentials before raw-source Git/Python subprocesses.
              const pinEnv = { KEEPER_CANONICAL_PIN_READ_TOKEN: process.env.KEEPER_CANONICAL_PIN_READ_TOKEN };
              delete process.env.KEEPER_CANONICAL_PIN_READ_TOKEN;
              delete process.env.KEEPER_CANONICAL_PRIVATE_ACTIONS_READ_TOKEN;
              // Pinned source bootstrap: validate captured bytes before importing repository code.
              const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
              const root = path.resolve(process.cwd()), guardPath = path.join(root, '.github/scripts/verify-ci-source.cjs');
              if (fs.realpathSync(root) !== root || fs.realpathSync(guardPath) !== guardPath) throw new Error('RAW_BOOTSTRAP_ALIAS');
              const before = fs.lstatSync(guardPath);
              if (!before.isFile() || before.nlink !== 1 || (before.mode & 0o100)) throw new Error('RAW_BOOTSTRAP_TYPE');
              const fd = fs.openSync(guardPath, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
              let bytes;
              try {
                const opened = fs.fstatSync(fd);
                if (!opened.isFile() || opened.dev !== before.dev || opened.ino !== before.ino) throw new Error('RAW_BOOTSTRAP_REPLACED');
                bytes = fs.readFileSync(fd);
              } finally { fs.closeSync(fd); }
              const oid = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
              if (oid !== '2c36d299851261d68965d37dbda024b950d46d8d') throw new Error('RAW_BOOTSTRAP_BLOB');
              const guard = new (require('node:module'))(guardPath);
              guard.filename = guardPath;
              guard._compile(bytes.toString('utf8'), guardPath);
              guard.exports.verifyRawCheckout(root, context.sha);
              // End pinned source bootstrap.
              const driver = require('./.github/native/canonical_native.cjs');
              const pinReader = driver.pinReaderFromEnvironment(github, pinEnv);
              const request = driver.requestFromEnvironment(context, process.env);
              await driver.origin(github, context, request, { admission: true, pinReader });
            } catch {
              core.setFailed('Canonical installed source, exact attempt or native capacity is unverified. No native credit.');
            }
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: yarn
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Ruby
        if: inputs.platform == 'IOS'
        uses: ruby/setup-ruby@675dd7ba1b06c8786a1480d89c384f5620a42647 # v1.281.0
        with:
          ruby-version: '3.3.8'
      - name: Select reviewed Xcode
        if: inputs.platform == 'IOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Set up Android command-line tools
        if: inputs.platform == 'ANDROID'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Record runner and toolchain
        run: python3 .github/native/hosted_native.py record
      - name: Install immutable native dependencies
        run: python3 .github/native/hosted_native.py prepare
      - name: Check disposable iOS driver readiness
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py driver
      - name: Build development app
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py build
      - name: Run disposable startup smoke
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py smoke
      - name: Run disposable native persistence probe
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py probe
      - name: Run R5 production worker native scenarios
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/hosted_native.py features
      - name: Measure full-product startup wallet and Retry flows
        if: inputs.platform == 'IOS'
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
          git diff --exit-code HEAD -- .github/native .github/workflows
          python3 .github/native/product_measurements.py run
      - name: Enable emulator acceleration
        if: inputs.platform == 'ANDROID'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-keeper-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android startup persistence worker and product flows
        if: inputs.platform == 'ANDROID'
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            test "$(git rev-parse HEAD)" = '${{ inputs.source_sha }}'
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/hosted_native.py smoke
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/hosted_native.py probe
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/hosted_native.py features
            git diff --exit-code HEAD -- .github/native .github/workflows
            python3 .github/native/product_measurements.py run
      - name: Retain exact canonical platform metadata
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keeper-canonical-native-${{ inputs.platform }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/${{ inputs.platform == 'IOS' && 'ios' || 'android' }}/metadata.json
          if-no-files-found: error
          retention-days: 7
