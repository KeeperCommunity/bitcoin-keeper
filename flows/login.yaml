# Disposable English-language fixture only: PIN 1111, biometric login disabled,
# no prior failed attempts, app already created. Never run against a real wallet.
appId: io.hexawallet.keeper
---
- extendedWaitUntil:
    visible: 'Enter your passcode'
    timeout: 20000
- assertVisible:
    id: 'btn_primaryText'
    text: 'Proceed'
    enabled: false
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- assertVisible:
    id: 'btn_primaryText'
    text: 'Proceed'
    enabled: false
- tapOn: '7'
- assertVisible:
    id: 'btn_primaryText'
    text: 'Proceed'
    enabled: true
- tapOn: 'Proceed'
- extendedWaitUntil:
    visible: 'Incorrect Passcode, Try Again!'
    timeout: 15000
- assertVisible:
    id: 'btn_primaryText'
    text: 'Proceed'
    enabled: false
# A single incorrect PIN shows an inline error, not a Retry modal.
- tapOn: '1'
- tapOn: '1'
- tapOn: '1'
- tapOn: '1'
- assertVisible:
    id: 'btn_primaryText'
    text: 'Proceed'
    enabled: true
- tapOn: 'Proceed'
- waitForAnimationToEnd:
    timeout: 5000
# The older sprint login has a security-tip Next action; R4 advances directly.
- extendedWaitUntil:
    visible: 'Next|Wallets'
    timeout: 30000
- runFlow:
    when:
      visible: 'Next'
    commands:
      - tapOn: 'Next'
- extendedWaitUntil:
    visible:
      id: 'text_home_current_plan'
    timeout: 30000
