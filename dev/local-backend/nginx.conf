server {
  listen 3000;
  client_max_body_size 50m;
  location / {
    proxy_pass http://relay:3000;
  }
}
server {
  listen 4002;
  location / {
    proxy_pass http://relay:4002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
server {
  listen 3003;
  location / {
    proxy_pass http://signing:3003;
  }
}
